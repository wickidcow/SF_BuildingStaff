name: Build SF_BuildingStaff

on:
  push:
    branches:
      - master
      - 'compat/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B --no-transfer-progress clean package

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SF_BuildingStaff
          path: target/SF_BuildingStaff*.jar
          if-no-files-found: error
